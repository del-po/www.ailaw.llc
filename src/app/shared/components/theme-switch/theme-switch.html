<button
  type="button"
  role="switch"
  class="switch"
  aria-label="Dark mode"
  [attr.aria-checked]="theme.isDark()"
  (click)="theme.toggle()"
>
  <span class="shuttle" aria-hidden="true">
    <svg class="icon-sun" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="4" />
      <path
        d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.28 5.28l1.42 1.42M17.3 17.3l1.42 1.42M5.28 18.72l1.42-1.42M17.3 6.7l1.42-1.42"
      />
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24">
      <path d="M20.35 14.35A8.5 8.5 0 0 1 9.65 3.65a8.5 8.5 0 1 0 10.7 10.7Z" />
    </svg>
  </span>
</button>
