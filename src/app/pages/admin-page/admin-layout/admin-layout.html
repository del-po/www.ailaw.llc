<div class="workspace">
  <aside class="side" aria-label="Admin">
    <a class="brand" routerLink="/admin">
      <span class="brand-tag">AI Law</span>
      <span class="brand-name">Admin</span>
    </a>

    <!-- ---------- Chat ---------- -->
    <nav class="block" aria-label="Chat">
      <div class="block-head">
        <a
          class="item item--main"
          routerLink="/admin"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          Chat
        </a>
        <button type="button" class="new" (click)="newChat()" aria-label="New chat">+</button>
      </div>
      @for (c of chat.conversations().slice(0, 8); track c.id) {
        <button
          type="button"
          class="talk"
          [class.is-active]="c.id === chat.activeId()"
          (click)="openChat(c.id)"
        >
          {{ c.title || 'New chat' }}
        </button>
      }
    </nav>

    <!-- ---------- Sections ---------- -->
    <nav class="block" aria-label="Sections">
      <p class="list-title">Work</p>
      @for (section of sections; track section.link) {
        <a class="item" [routerLink]="section.link" routerLinkActive="is-active">
          <span>{{ section.label }}</span>
          @if (count(section)) {
            <span class="badge" [attr.aria-label]="count(section) + ' waiting'">{{
              count(section)
            }}</span>
          }
        </a>
      }
    </nav>

    <!-- ---------- Profile menu ---------- -->
    <div class="me">
      <button
        type="button"
        class="me-open"
        (click)="menuOpen.set(!menuOpen())"
        [attr.aria-expanded]="menuOpen()"
      >
        <span class="avatar" aria-hidden="true">{{ name().charAt(0) }}</span>
        <span class="me-text">
          <span class="me-name">{{ name() }}</span>
          <span class="me-code">{{ auth.profile()?.ClientID }}</span>
        </span>
      </button>
      @if (menuOpen()) {
        <div class="me-menu">
          <a class="me-link" routerLink="/profile/settings">Settings</a>
          <a class="me-link" routerLink="/">Back to the website</a>
          <button type="button" class="me-link" (click)="signOut()">Log out</button>
        </div>
      }
    </div>
  </aside>

  <main class="main">
    <router-outlet />
  </main>
</div>
