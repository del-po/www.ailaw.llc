<div class="page">
  <app-header />

  <main class="auth">
    <section class="intro">
      <div class="code" aria-hidden="true"><span class="code-tag">Account</span></div>
      <h1 class="title">Register</h1>
      <p class="lead">
        One account for ordering services, keeping your documents and continuing your chats with AI
        Law.
      </p>
    </section>

    <form class="form" (submit)="submit($event, name.value, email.value, password.value)">
      <button type="button" class="btn btn--light" [disabled]="busy()" (click)="google()">
        <app-shape name="field">
          <span class="btn-content"><app-icon name="google" />Continue with Google</span>
        </app-shape>
      </button>

      <p class="divider">or</p>

      <label class="field">
        <span class="field-label">Full name</span>
        <app-shape class="field-box" name="field">
          <input
            #name
            type="text"
            name="name"
            autocomplete="name"
            maxlength="100"
            required
            pattern="[A-Za-z][A-Za-z '.\-]*"
            title="Please write your name in English letters"
          />
        </app-shape>
      </label>

      <label class="field">
        <span class="field-label">Email</span>
        <app-shape class="field-box" name="field">
          <input #email type="email" name="email" autocomplete="email" required />
        </app-shape>
      </label>

      <label class="field">
        <span class="field-label">Password · at least {{ minPassword }} characters</span>
        <app-shape class="field-box" name="field">
          <input
            #password
            type="password"
            name="password"
            autocomplete="new-password"
            [minLength]="minPassword"
            required
          />
        </app-shape>
      </label>

      @if (error()) {
        <p class="message" role="alert">{{ error() }}</p>
      }

      <button type="submit" class="btn" [disabled]="busy()">
        <app-shape name="field">{{ busy() ? 'Creating account…' : 'Create account' }}</app-shape>
      </button>

      <p class="small">
        By creating an account you agree to our <a class="link" routerLink="/terms">Terms</a> and
        <a class="link" routerLink="/privacy">Privacy Policy</a>.
      </p>
      <p class="small">Already registered? <a class="link" routerLink="/login">Log in</a></p>
      <p class="small">Are you a lawyer? <a class="link" routerLink="/join">Join AI Law as a lawyer</a></p>
    </form>
  </main>

  <app-footer />
</div>
