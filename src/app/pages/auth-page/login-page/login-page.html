<div class="page">
  <app-header />

  <main class="auth">
    <section class="intro">
      <div class="code" aria-hidden="true"><span class="code-tag">Account</span></div>
      <h1 class="title">Log in</h1>
      <p class="lead">Your orders, documents and conversations with AI Law, in one place.</p>
    </section>

    <form class="form" (submit)="submit($event, email.value, password.value)">
      <button type="button" class="btn btn--light" [disabled]="busy()" (click)="google()">
        <app-shape name="field">
          <span class="btn-content"><app-icon name="google" />Continue with Google</span>
        </app-shape>
      </button>

      <p class="divider">or</p>

      <label class="field">
        <span class="field-label">Email</span>
        <app-shape class="field-box" name="field">
          <input #email type="email" name="email" autocomplete="email" required />
        </app-shape>
      </label>

      <label class="field">
        <span class="field-head">
          <span class="field-label">Password</span>
          <a class="small link" routerLink="/forgot-password">Forgot password?</a>
        </span>
        <app-shape class="field-box" name="field">
          <input
            #password
            type="password"
            name="password"
            autocomplete="current-password"
            required
          />
        </app-shape>
      </label>

      @if (error()) {
        <p class="message" role="alert">{{ error() }}</p>
      }

      <button type="submit" class="btn" [disabled]="busy()">
        <app-shape name="field">{{ busy() ? 'Logging in…' : 'Log in' }}</app-shape>
      </button>

      <p class="small">
        New to AI Law? <a class="link" routerLink="/register">Create an account</a>
      </p>
    </form>
  </main>

  <app-footer />
</div>
